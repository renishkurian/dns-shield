{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DNS Shield — Raspberry Pi DNS management platform" />
  <title>DNS Shield</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" />
  <!-- Inertia page data -->
  <script id="inertia-data" type="application/json">
    {"page": "{{ page }}", "props": {{ props|safe }}}
  </script>
  {% if debug %}
  <!-- Dev: Vite HMR -->
  <script type="module" src="http://localhost:5173/@vite/client"></script>
  <script type="module" src="http://localhost:5173/src/main.jsx"></script>
  {% else %}
  <!-- Production: hashed Vite build (cache-busting) -->
  <link rel="stylesheet" href="{{ vite_css }}" />
  <script type="module" src="{{ vite_js }}"></script>
  {% endif %}
</head>

<body>
  {% if props %}
  <div id="app" data-page='{{ page_json|safe }}'></div>
  {% else %}
  <div id="app"></div>
  {% endif %}
  <script>
    // Bootstrap Inertia with server-rendered props
    window.__inertia_initial_page = {
      component: "{{ page }}",
      props: {{ props | safe }},
      url: window.location.href,
      version: "1"
    };
  </script>
</body>

</html>
