{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DNS Shield — Raspberry Pi DNS management platform" />
  <title>DNS Shield</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" />
  {% if debug %}
  <!-- Dev: Vite HMR -->
  <script type="module" src="http://localhost:5173/@vite/client"></script>
  <script type="module" src="http://localhost:5173/src/main.jsx"></script>
  {% else %}
  <!-- Production: hashed Vite build (cache-busting) -->
  <link rel="stylesheet" href="{{ vite_css }}" />
  <script type="module" src="{{ vite_js }}"></script>
  {% endif %}
</head>

<body>
  {# Double-quoted + auto-escaped: apostrophes/quotes in AI logs must not break JSON.parse #}
  {% if page_json %}
  <div id="app" data-page="{{ page_json }}"></div>
  {% else %}
  <div id="app"></div>
  {% endif %}
</body>

</html>
